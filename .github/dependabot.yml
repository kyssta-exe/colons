version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /colons/web
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /colons
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
