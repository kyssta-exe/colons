name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: colons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check backend/
      - run: pytest -q
  browser-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: colons/web/package-lock.json
      - run: python -m pip install -e './colons[dev,browser]' build
      - run: python -m playwright install --with-deps chromium
      - name: Native browser regressions
        working-directory: colons
        run: |
          export COLONS_BROWSER_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          pytest tests/test_browser.py -q
      - name: Build distribution with bundled UI
        run: ./scripts/build-release.sh
      - name: Check installed wheel commands and Hermes adapter
        run: |
          python -m venv "$RUNNER_TEMP/colons-wheel"
          wheel_path="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")))')"
          "$RUNNER_TEMP/colons-wheel/bin/python" -m pip install "${wheel_path}[hermes]"
          python colons/tests/package_smoke.py --venv "$RUNNER_TEMP/colons-wheel"
      - name: UI and workspace smoke checks
        run: |
          export COLONS_BROWSER_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export COLONS_DATA_DIR="$RUNNER_TEMP/colons-data"
          export COLONS_STORE_URL="$COLONS_DATA_DIR/memory.db"
          export COLONS_CONFIG="$RUNNER_TEMP/colons-ci.json"
          printf '%s\n' '{"server":{"rate_limit_per_minute":0}}' > "$COLONS_CONFIG"
          python -m uvicorn colons_api.main:app --host 127.0.0.1 --port 8139 > "$RUNNER_TEMP/colons-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8139/health > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/colons-server.log"; exit 1; fi
          python colons/tests/web_smoke.py --url http://127.0.0.1:8139 --output "$RUNNER_TEMP/colons-screenshots/chat"
          python colons/tests/web_workspace_smoke.py --url http://127.0.0.1:8139 --output "$RUNNER_TEMP/colons-screenshots/workspace"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colons-distributions
          path: dist/*
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colons-ui-checks
          path: ${{ runner.temp }}/colons-screenshots
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build self-hosted image
        run: docker build --tag colons:ci ./colons
      - name: Smoke check container
        run: |
          docker run -d --name colons-ci -p 127.0.0.1:8142:8000 colons:ci
          trap 'docker logs colons-ci; docker rm -f colons-ci' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8142/health > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          curl -fsS http://127.0.0.1:8142/ | grep -q '<title>Colons</title>'
          curl -fsS http://127.0.0.1:8142/favicon.svg | grep -q 'cx="64"'
